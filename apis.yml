name: Drishti Technologies
description: Drishti Technologies was a Mountain View, California company (founded 2016 by Prasad
  Akella, Krishnendu Chaudhury, and Ashish Gupta) that applied AI-powered computer vision and video
  analytics to manual assembly lines in manufacturing. Its platform digitized human actions on the
  production floor to enable time-and-motion studies at scale, quality traceability, and continuous
  improvement, with products including Drishti Trace (video capture and traceability) and Drishti
  Flow (line analytics). The company was acquired by Apple in September 2023 and no longer operates
  an independent public website, developer portal, or API surface — its domains (drishti.com,
  drishti.ai) no longer resolve to a live product.
